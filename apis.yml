name: Ping An HealthKonnect
description: 'Ping An HealthKonnect (Ping An Healthcare Technology), founded in September 2016 and
  headquartered in Shanghai, is a technology-driven managed care platform in China. As an AI-powered
  big data platform it brings together patients with providers of health insurance and medical
  services, offering budget planning, precision healthcare, medical health-care accounts, medical
  resources management, health records, and fraud/abuse detection to optimize healthcare spending.
  The platform covers roughly 70% of Chinese cities and a market of some 800 million people, and has
  raised about USD 1.15 billion backed by SoftBank Vision Fund, IDG Capital, and others. It is a B2B
  and government-facing enterprise platform with no public developer API surface; this profile was
  surfaced as a SoftBank Vision Fund portfolio company and added to the API Evangelist network for
  enrichment.'
